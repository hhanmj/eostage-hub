name: Sync to Gitee & GitCode Mirrors

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee (if GITEE_TOKEN configured)
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN not set, skipping Gitee sync."
            exit 0
          fi
          USER_NAME="${GITEE_USER:-hhanmj}"
          git push --force "https://${USER_NAME}:${GITEE_TOKEN}@gitee.com/${USER_NAME}/eostage-hub.git" HEAD:main --tags || \
          git push --force "https://${USER_NAME}:${GITEE_TOKEN}@gitee.com/${USER_NAME}/sceneport-hub.git" HEAD:main --tags

      - name: Push to GitCode (if GITCODE_TOKEN configured)
        env:
          GITCODE_USER: ${{ secrets.GITCODE_USER }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          if [ -z "$GITCODE_TOKEN" ]; then
            echo "GITCODE_TOKEN not set, skipping GitCode sync."
            exit 0
          fi
          USER_NAME="${GITCODE_USER:-hhanmj}"
          git push --force "https://oauth2:${GITCODE_TOKEN}@gitcode.com/${USER_NAME}/eostage-hub.git" HEAD:main --tags || \
          git push --force "https://oauth2:${GITCODE_TOKEN}@gitcode.com/${USER_NAME}/sceneport-hub.git" HEAD:main --tags
